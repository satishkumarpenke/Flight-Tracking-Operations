 
  <section class="filter-panel">

    <form [formGroup]="filterFlightsForm">

      <div class="filter-group">

        <label>Search Callsign</label>

        <input
          type="text"
          formControlName="search"
          placeholder="e.g. AIC101"
        />

      </div>


      <div class="filter-group">

        <label>Status</label>

        <select formControlName="status">

          <option value="All">All Statuses</option>

          <option
            *ngFor="let status of statuses"
            [value]="status">

            {{ status }}

          </option>

        </select>

      </div>


      <div class="filter-group">

        <label>Origin</label>

        <select formControlName="origin">

          <option value="All">All Airports</option>

          <option
            *ngFor="let airport of airports"
            [value]="airport">

            {{ airport }}

          </option>

        </select>

      </div>


      <div class="filter-group">

        <label>Destination</label>

        <select formControlName="destination">

          <option value="All">All Airports</option>

          <option
            *ngFor="let airport of airports"
            [value]="airport">

            {{ airport }}

          </option>

        </select>

      </div>


      <button
        type="button"
        class="clear-btn"
        (click)="clearFilters()">
        Clear
      </button>
      <!-- <button type="button" class="clear-btn" (click)="selectFlight(selectedFlight)">apply</button> -->

    </form>

  </section>
